name: Validate DeviceDB

on:
  push:
    branches: [ main ]
    paths:
      - 'database.json'
      - 'devices/**'
      - 'generated/**'
      - 'protocols/**'
      - 'schemas/**'
      - 'wifi/**'
      - 'device-types.json'
      - 'ui-templates/**'
      - 'tools/validate_db.py'
      - 'tools/validate_wifi.py'
      - 'tools/validate_device_catalog.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'database.json'
      - 'devices/**'
      - 'generated/**'
      - 'protocols/**'
      - 'schemas/**'
      - 'wifi/**'
      - 'device-types.json'
      - 'ui-templates/**'
      - 'tools/validate_db.py'
      - 'tools/validate_wifi.py'
      - 'tools/validate_device_catalog.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate main DeviceDB
        run: python3 tools/validate_db.py
      - name: Validate dynamic Wi-Fi drivers
        run: python3 tools/validate_wifi.py
      - name: Validate dynamic device types and UI templates
        run: python3 tools/validate_device_catalog.py
