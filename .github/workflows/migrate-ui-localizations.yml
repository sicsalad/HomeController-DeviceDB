name: Migrate UI localizations once

on:
  push:
    branches: [main]
    paths:
      - tools/migrate_ui_localizations.py
      - .github/workflows/migrate-ui-localizations.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Convert localized templates
        run: python tools/migrate_ui_localizations.py
      - name: Commit converted files and remove one-shot migration
        run: |
          rm -f tools/migrate_ui_localizations.py .github/workflows/migrate-ui-localizations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Compact UI template language overlays"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved; rebasing and retrying ($attempt/4)"
            git pull --rebase origin main
          done
          echo "Could not push migration after retries." >&2
          exit 1
