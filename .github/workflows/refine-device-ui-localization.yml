name: Refine device UI localization terminology
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-device-ui-localization.yml']
permissions: {contents: write}
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Refine terminology
        shell: python
        run: |
          import json
          from pathlib import Path
          # UI/device vocabulary is curated for how remotes and appliance controls are actually labelled.
          terms={
            'hu': {'Power':'BE/KI','Volume':'Hangerő','Vol':'Vol','Vol +':'Vol +','Vol -':'Vol -','Guide':'Műsorújság','Play':'Lejátszás','RED':'PIROS','GREEN':'ZÖLD','YELLOW':'SÁRGA','BLUE':'KÉK','Temp':'TEMP','Temp +':'TEMP +','Temp -':'TEMP -','Temperature':'Hőmérséklet','Port':'Port','Settings':'Beállítások','Swing':'Swing','Type':'Típus','TV':'TV','Source':'Forrás','Start':'Indítás','Stop':'Stop','Fan':'Ventilátor','Fan Speed':'Ventilátor sebesség','Mute':'Némítás','Channel':'Csatorna','Menu':'Menü','Info':'Infó'},
            'de': {'Power':'EIN/AUS','Volume':'Lautstärke','Vol':'Vol','Vol +':'Vol +','Vol -':'Vol -','Guide':'EPG','Play':'Play','RED':'ROT','GREEN':'GRÜN','YELLOW':'GELB','BLUE':'BLAU','Temp':'TEMP','Temp +':'TEMP +','Temp -':'TEMP -','Temperature':'Temperatur'},
            'fr': {'Power':'MARCHE/ARRÊT','Volume':'Volume','Vol':'Vol','Vol +':'Vol +','Vol -':'Vol -','Guide':'Guide TV','Play':'Lecture','RED':'ROUGE','GREEN':'VERT','YELLOW':'JAUNE','BLUE':'BLEU','Temp':'TEMP','Temp +':'TEMP +','Temp -':'TEMP -','Temperature':'Température'},
            'ru': {'Power':'ВКЛ/ВЫКЛ','Volume':'Громкость','Vol':'Vol','Vol +':'Vol +','Vol -':'Vol -','Guide':'Телегид','Play':'Воспроизв.','RED':'КРАСНЫЙ','GREEN':'ЗЕЛЁНЫЙ','YELLOW':'ЖЁЛТЫЙ','BLUE':'СИНИЙ','Temp':'TEMP','Temp +':'TEMP +','Temp -':'TEMP -','Temperature':'Температура'} }
          for lang,m in terms.items():
            p=Path(f'localization/{lang}.json'); d=json.loads(p.read_text(encoding='utf-8-sig')); st=d['strings']
            for k,v in m.items():
              if k in st: st[k]=v
            for k in ('Home Controller','HomeController'):
              if k in st: st[k]=k
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          replacements={'hu':{'HATALOM':'BE/KI','Hatalom':'BE/KI','KÖTET':'VOL','Kötet':'Vol','ÚTMUTATÓ':'MŰSORÚJSÁG','Útmutató':'Műsorújság','JÁTÉK':'PLAY','Játék':'Play','PIRO':'PIROS','TEMP.':'TEMP','Temp':'TEMP'},'de':{'LEISTUNG':'EIN/AUS','Macht':'EIN/AUS'},'fr':{'PUISSANCE':'MARCHE/ARRÊT','Pouvoir':'MARCHE/ARRÊT'},'ru':{'ВЛАСТЬ':'ВКЛ/ВЫКЛ'}}
          for p in Path('ui-templates').glob('*.json'):
            if p.name=='index.json': continue
            lang=next((x for x in terms if p.stem.endswith('-'+x)),None)
            if not lang: continue
            d=json.loads(p.read_text(encoding='utf-8-sig'))
            def walk(x):
              if isinstance(x,dict):
                if x.get('command') in ('Red','Green','Yellow','Blue') and '-tv-modern-' in p.name: x.pop('icon',None)
                for k,v in list(x.items()):
                  if k in ('label','title','subtitle','name','themeSwitcherText') and isinstance(v,str):
                    v=replacements.get(lang,{}).get(v,v)
                    if v in ('Vol +','VOL +'): v='VOL +'
                    elif v in ('Vol -','Vol −','VOL -','VOL −'): v='VOL −'
                    elif v in ('Temp +','TEMP +'): v='TEMP +'
                    elif v in ('Temp -','Temp −','TEMP -','TEMP −'): v='TEMP −'
                    elif v=='Temp': v='TEMP'
                    x[k]=v
                  else: walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(d); p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add localization ui-templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete device UI terminology review"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 2; done
          exit 1
