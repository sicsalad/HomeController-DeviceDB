name: Function catalog - DeviceDB
on:
  push:
    branches: [ main ]
    paths: ['ui-templates/**','ir/**','wifi/**','codesets/**','devices/**','generated/**','protocols/**','database.json','catalog-v2.json','curated-database.json','device-types.json','tools/generate_function_catalog.py']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Scan local DeviceDB only
        run: python tools/generate_function_catalog.py
      - name: Verify local coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('function-catalog.json',encoding='utf-8')); by={x['id']:x for x in d['functions']}
          for required in ('VolumeUp','Turbo','FootballMode'): assert required in by, f'{required} missing'
          assert 'air-conditioner' in by['Turbo']['deviceTypes']
          PY
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- function-catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add function-catalog.json; git commit -m 'Regenerate DeviceDB function catalog'; git push
