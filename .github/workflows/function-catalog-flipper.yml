name: Function catalog - Flipper IRDB
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Scan DeviceDB and complete Flipper-IRDB
        run: python tools/generate_function_catalog.py --include-flipper
      - name: Verify Flipper enrichment
        run: |
          python - <<'PY'
          import json
          d=json.load(open('function-catalog.json',encoding='utf-8'))
          assert 'Lucaslhm/Flipper-IRDB' in d.get('generatedFrom',[])
          print('functions:',len(d['functions']))
          PY
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- function-catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add function-catalog.json; git commit -m 'Enrich function catalog from Flipper-IRDB'; git push
