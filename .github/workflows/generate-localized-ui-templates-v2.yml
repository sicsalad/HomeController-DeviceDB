name: Generate localized UI templates safely
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install -q pyyaml
      - name: Generate variants using translation table
        shell: python
        run: |
          import pathlib,yaml
          wf=yaml.safe_load(pathlib.Path('.github/workflows/generate-localized-ui-templates.yml').read_text())
          step=wf['jobs']['generate']['steps'][1]
          exec(step['run'])
      - name: Commit and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add localized variants for all device UI templates"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
