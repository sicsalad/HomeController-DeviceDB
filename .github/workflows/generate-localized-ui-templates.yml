name: Generate localized UI templates
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - shell: python
        run: |
          import json,pathlib
          root=pathlib.Path('ui-templates')
          index=json.loads((root/'index.json').read_text())
          fields={'name','title','subtitle','label','themeSwitcherText'}
          maps={
          'hu':{
          'Infrared Climate Default':'Alapértelmezett infrás klíma','Infrared TV Default':'Alapértelmezett infrás TV','Round TV':'Kerek TV','Round TV Remote':'Kerek TV távirányító','Hubitat Default':'Hubitat alapértelmezett','Hubitat Compact':'Hubitat kompakt','Philips Hue Default':'Philips Hue alapértelmezett','Philips Hue Grid':'Philips Hue rács','Wi-Fi Climate Default':'Alapértelmezett Wi-Fi klíma','Wi-Fi TV Default':'Alapértelmezett Wi-Fi TV','Modern Climate':'Modern klíma','Modern TV':'Modern TV','Power and quick actions':'Bekapcsolás és gyorsműveletek','Quick controls':'Gyorsvezérlők','Climate control':'Klímavezérlés','Target temperature':'Célhőmérséklet','Power / Volume':'Bekapcsolás / Hangerő','Power':'Bekapcsolás','On':'Be','Off':'Ki','Temperature':'Hőmérséklet','Target °C':'Cél °C','Mode':'Üzemmód','Auto':'Auto','Cool':'Hűtés','Heat':'Fűtés','Dry':'Szárítás','Fan':'Ventilátor','Functions':'Funkciók','Quiet':'Csendes','Turbo':'Turbo','Economy':'Takarékos','Sleep':'Alvás','Display':'Kijelző','Health':'Egészség','Navigation':'Navigáció','Up':'Fel','Left':'Bal','Right':'Jobb','Down':'Le','Back':'Vissza','Home':'Kezdőlap','Source':'Forrás','Mute':'Némítás','MUTE':'NÉMÍTÁS','INFO':'INFÓ','MENU':'MENÜ','SOURCE':'FORRÁS','NAVIGATION':'NAVIGÁCIÓ','CH LIST':'CSATORNALISTA','GUIDE':'MŰSORÚJSÁG','COLOUR KEYS':'SZÍNES GOMBOK','TOOLS':'ESZKÖZÖK','MEDIA':'MÉDIA','STOP':'STOP','TEMPERATURE':'HŐMÉRSÉKLET','COOLER':'HIDEGEBB','WARMER':'MELEGEBB','MODE':'ÜZEMMÓD','FAN':'VENTILÁTOR','FAN AUTO':'VENTILÁTOR AUTO','AIR FLOW':'LÉGÁRAM','FAN SPEED':'VENTILÁTORSEBESSÉG','VERTICAL SWING':'FÜGGŐLEGES MOZGÁS','HORIZONTAL SWING':'VÍZSZINTES MOZGÁS','SWING':'MOZGÁS','COMFORT':'KOMFORT','COMFORT & ENERGY':'KOMFORT ÉS ENERGIA','POWER SAVE':'ENERGIATAKARÉKOS','LIGHT':'FÉNY','MORE':'TOVÁBBIAK','SELF CLEAN':'ÖNTISZTÍTÁS','I FEEL':'I FEEL','TIMER':'IDŐZÍTŐ','SET TEMPERATURE':'HŐMÉRSÉKLET BEÁLLÍTÁSA','Volume · direction · channel':'Hangerő · irány · csatorna','RED':'PIROS','GREEN':'ZÖLD','YELL