,'SUBTITLE':'UNTERTITEL','EXIT':'BEENDEN','OPTIONS':'OPTIONEN','POWER':'EIN/AUS','AUTO':'AUTO','COOL':'KÜHLEN','HEAT':'HEIZEN','DRY':'TROCKNEN','TURBO':'TURBO','QUIET':'LEISE','ECO':'ECO','SLEEP':'SCHLAF','DISPLAY':'ANZEIGE','HEALTH':'GESUNDHEIT'},
          'fr':{
          'Infrared Climate Default':'Climatisation infrarouge par défaut','Infrared TV Default':'TV infrarouge par défaut','Round TV':'TV ronde','Round TV Remote':'Télécommande TV ronde','Hubitat Default':'Hubitat par défaut','Hubitat Compact':'Hubitat compact','Philips Hue Default':'Philips Hue par défaut','Philips Hue Grid':'Grille Philips Hue','Wi-Fi Climate Default':'Climatisation Wi-Fi par défaut','Wi-Fi TV Default':'TV Wi-Fi par défaut','Modern Climate':'Climatisation moderne','Modern TV':'TV moderne','Power and quick actions':'Alimentation et actions rapides','Quick controls':'Commandes rapides','Climate control':'Commande de climatisation','Target temperature':'Température cible','Power / Volume':'Alimentation / Volume','Power':'Alimentation','On':'Marche','Off':'Arrêt','Temperature':'Température','Target °C':'Cible °C','Mode':'Mode','Auto':'Auto','Cool':'Froid','Heat':'Chauffage','Dry':'Déshumidification','Fan':'Ventilateur','Functions':'Fonctions','Quiet':'Silencieux','Turbo':'Turbo','Economy':'Éco','Sleep':'Sommeil','Display':'Affichage','Health':'Santé','Navigation':'Navigation','Up':'Haut','Left':'Gauche','Right':'Droite','Down':'Bas','Back':'Retour','Home':'Accueil','Source':'Source','Mute':'Muet','MUTE':'MUET','INFO':'INFO','MENU':'MENU','SOURCE':'SOURCE','NAVIGATION':'NAVIGATION','CH LIST':'LISTE CHAÎNES','GUIDE':'GUIDE','COLOUR KEYS':'TOUCHES COULEUR','TOOLS':'OUTILS','MEDIA':'MÉDIA','STOP':'STOP','TEMPERATURE':'TEMPÉRATURE','COOLER':'PLUS FROID','WARMER':'PLUS CHAUD','MODE':'MODE','FAN':'VENTILATEUR','FAN AUTO':'VENTILATEUR AUTO','AIR FLOW':'FLUX D’AIR','FAN SPEED':'VITESSE VENTILATEUR','VERTICAL SWING':'OSCILLATION VERTICALE','HORIZONTAL SWING':'OSCILLATION HORIZONTALE','SWING':'OSCILLATION','COMFORT':'CONFORT','COMFORT & ENERGY':'CONFORT & ÉNERGIE','POWER SAVE':'ÉCONOMIE D’ÉNERGIE','LIGHT':'LUMIÈRE','MORE':'PLUS','SELF CLEAN':'AUTO-NETTOYAGE','TIMER':'MINUTERIE','SET TEMPERATURE':'RÉGLER LA TEMPÉRATURE','Volume · direction · channel':'Volume · direction · chaîne','RED':'ROUGE','GREEN':'VERT','YELLOW':'JAUNE','BLUE':'BLEU','CHANNEL LIST':'LISTE CHAÎNES','TEXT':'TEXTE','SUBTITLE':'SOUS-TITRES','EXIT':'QUITTER','OPTIONS':'OPTIONS','POWER':'ALIMENTATION','AUTO':'AUTO','COOL':'FROID','HEAT':'CHAUFFAGE','DRY':'DÉSHUMIDIFICATION','TURBO':'TURBO','QUIET':'SILENCIEUX','ECO':'ÉCO','SLEEP':'SOMMEIL','DISPLAY':'AFFICHAGE','HEALTH':'SANTÉ'},
          'ru':{
          'Infrared Climate Default':'ИК-климат по умолчанию','Infrared TV Default':'ИК-ТВ по умолчанию','Round TV':'Круглый ТВ','Round TV Remote':'Круглый пульт ТВ','Hubitat Default':'Hubitat по умолчанию','Hubitat Compact':'Hubitat компактный','Philips Hue Default':'Philips Hue по умолчанию','Philips Hue Grid':'Сетка Philips Hue','Wi-Fi Climate Default':'Wi-Fi климат по умолчанию','Wi-Fi TV Default':'Wi-Fi ТВ по умолчанию','Modern Climate':'Современный климат','Modern TV':'Современный ТВ','Power and quick actions':'Питание и быстрые действия','Quick controls':'Быстрое управление','Climate control':'Управление климатом','Target temperature':'Целевая температура','Power / Volume':'Питание / Громкость','Power':'Питание','On':'Вкл.','Off':'Выкл.','Temperature':'Температура','Target °C':'Цель °C','Mode':'Режим','Auto':'Авто','Cool':'Охлаждение','Heat':'Обогрев','Dry':'Осушение','Fan':'Вентилятор','Functions':'Функции','Quiet':'Тихо','Turbo':'Турбо','Economy':'Эко','Sleep':'Сон','Display':'Дисплей','Health':'Здоровье','Navigation':'Навигация','Up':'Вверх','Left':'Влево','Right':'Вправо','Down':'Вниз','Back':'Назад','Home':'Главная','Source':'Источник','Mute':'Без звука','MUTE':'БЕЗ ЗВУКА','INFO':'ИНФО','MENU':'МЕНЮ','SOURCE':'ИСТОЧНИК','NAVIGATION':'НАВИГАЦИЯ','CH LIST':'СПИСОК КАНАЛОВ','GUIDE':'ТЕЛЕГИД','COLOUR KEYS':'ЦВЕТНЫЕ КНОПКИ','TOOLS':'ИНСТРУМЕНТЫ','MEDIA':'МЕДИА','STOP':'СТОП','TEMPERATURE':'ТЕМПЕРАТУРА','COOLER':'ХОЛОДНЕЕ','WARMER':'ТЕПЛЕЕ','MODE':'РЕЖИМ','FAN':'ВЕНТИЛЯТОР','FAN AUTO':'ВЕНТИЛЯТОР АВТО','AIR FLOW':'ПОТОК ВОЗДУХА','FAN SPEED':'СКОРОСТЬ ВЕНТИЛЯТОРА','VERTICAL SWING':'ВЕРТИКАЛЬНОЕ КАЧАНИЕ','HORIZONTAL SWING':'ГОРИЗОНТАЛЬНОЕ КАЧАНИЕ','SWING':'КАЧАНИЕ','COMFORT':'КОМФОРТ','COMFORT & ENERGY':'КОМФОРТ И ЭНЕРГИЯ','POWER SAVE':'ЭНЕРГОСБЕРЕЖЕНИЕ','LIGHT':'СВЕТ','MORE':'ЕЩЁ','SELF CLEAN':'САМООЧИСТКА','TIMER':'ТАЙМЕР','SET TEMPERATURE':'УСТАНОВИТЬ ТЕМПЕРАТУРУ','Volume · direction · channel':'Громкость · направление · канал','RED':'КРАСНЫЙ','GREEN':'ЗЕЛЁНЫЙ','YELLOW':'ЖЁЛТЫЙ','BLUE':'СИНИЙ','CHANNEL LIST':'СПИСОК КАНАЛОВ','TEXT':'ТЕКСТ','SUBTITLE':'СУБТИТРЫ','EXIT':'ВЫХОД','OPTIONS':'ОПЦИИ','POWER':'ПИТАНИЕ','AUTO':'АВТО','COOL':'ОХЛАЖДЕНИЕ','HEAT':'ОБОГРЕВ','DRY':'ОСУШЕНИЕ','TURBO':'ТУРБО','QUIET':'ТИХО','ECO':'ЭКО','SLEEP':'СОН','DISPLAY':'ДИСПЛЕЙ','HEALTH':'ЗДОРОВЬЕ'} }
          def translate_obj(obj,mp):
              if isinstance(obj,dict):
                  return {k:(mp.get(v,v) if k in fields and isinstance(v,str) else translate_obj(v,mp)) for k,v in obj.items()}
              if isinstance(obj,list): return [translate_obj(v,mp) for v in obj]
              return obj
          for item in index['templates']:
              base=root/item['path']; data=json.loads(base.read_text())
              stem=base.stem
              for lang,mp in maps.items():
                  out=root/f'{stem}-{lang}.json'
                  out.write_text(json.dumps(translate_obj(data,mp),ensure_ascii=False,indent=2)+'\n')
          en=root/'wifi-tv-default-en.json'
          if en.exists(): en.unlink()
      - name: Commit generated templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add localized variants for all device UI templates"
          git push
