name: Update Flipper imports

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [ main ]
    paths:
      - 'tools/import_flipper.py'
      - 'tools/sync_device_types.py'
      - 'tools/fix_generated_protocols.py'
      - 'tools/improve_canonicals.py'
      - 'tools/normalize_manufacturers.py'
      - 'tools/enrich_codeset_catalog.py'
      - 'tools/generate_top_tv_codesets.py'
      - 'tools/validate_db.py'
      - 'curated-database.json'
      - '.github/workflows/update-flipper.yml'

permissions:
  contents: write

concurrency:
  group: device-db-update
  cancel-in-progress: true

jobs:
  build-device-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeviceDB
        uses: actions/checkout@v4
        with:
          path: db
          persist-credentials: true

      - name: Checkout Flipper-IRDB
        uses: actions/checkout@v4
        with:
          repository: Lucaslhm/Flipper-IRDB
          path: flipper

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate database
        id: generate
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '=== sync_device_types.py ==='
            python3 db/tools/sync_device_types.py --source flipper --output db
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== import_flipper.py ==='
            python3 db/tools/import_flipper.py --source flipper --output db
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== fix_generated_protocols.py ==='
            python3 db/tools/fix_generated_protocols.py
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== improve_canonicals.py ==='
            python3 db/tools/improve_canonicals.py
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== normalize_manufacturers.py ==='
            python3 db/tools/normalize_manufacturers.py
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== enrich_codeset_catalog.py ==='
            python3 db/tools/enrich_codeset_catalog.py
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== generate_top_tv_codesets.py ==='
            python3 db/tools/generate_top_tv_codesets.py
            code=$?
            if [ "$code" != "0" ]; then exit "$code"; fi

            echo '=== validate_db.py ==='
            python3 db/tools/validate_db.py
          } 2>&1 | tee device-db-update.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare diagnostic result
        if: always()
        working-directory: db
        shell: bash
        run: |
          mkdir -p .ci
          code='${{ steps.generate.outputs.exit_code }}'
          {
            echo 'HomeController DeviceDB update'
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit tested: $GITHUB_SHA"
            if [ "$code" = "0" ]; then
              echo 'STATUS: SUCCESS'
            else
              echo "STATUS: FAILED ($code)"
              echo
              echo 'Last output:'
              tail -n 250 ../device-db-update.log
            fi
          } > .ci/device-db-update.txt

      - name: Commit generated database and CodeSet mappings
        if: steps.generate.outputs.exit_code == '0'
        working-directory: db
        shell: bash
        run: |
          git config user.name 'HomeController DeviceDB Bot'
          git config user.email 'device-db-bot@users.noreply.github.com'
          git add .ci/device-db-update.txt device-types.json database.json generated catalog-v2.json codesets
          if git diff --cached --quiet; then
            echo 'No DeviceDB or CodeSet catalog changes.'
          else
            git commit -m 'Update generated DeviceDB types and CodeSet mappings'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Publish failure diagnostic
        if: steps.generate.outputs.exit_code != '0'
        working-directory: db
        shell: bash
        run: |
          git config user.name 'HomeController DeviceDB CI'
          git config user.email 'device-db-ci@users.noreply.github.com'
          git add .ci/device-db-update.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record DeviceDB update failure'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail when generation or validation failed
        if: steps.generate.outputs.exit_code != '0'
        run: exit 1
