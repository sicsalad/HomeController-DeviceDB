name: Version DeviceDB changes

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'metadata/version.json'
      - 'metadata/changelog.json'
      - 'releases/homecontroller/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Update DeviceDB version and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(date -u +%s)"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          PUBLISHED_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PATCH_NOTE="$(git log -1 --pretty=%B | sed '/^[[:space:]]*$/d' | head -c 1500)"
          if [ -z "$PATCH_NOTE" ]; then PATCH_NOTE="DeviceDB content updated."; fi
          export PATCH_NOTE

          python3 - <<PY
          import json, os
          from pathlib import Path

          version = "${VERSION}"
          code = int("${VERSION_CODE}")
          published = "${PUBLISHED_UTC}"
          commit = "${GITHUB_SHA}"
          note = os.environ.get("PATCH_NOTE", "DeviceDB content updated.").strip()

          Path("metadata").mkdir(parents=True, exist_ok=True)
          info = {
              "schemaVersion": 1,
              "version": version,
              "versionCode": code,
              "publishedUtc": published,
              "commit": commit,
              "patchNotes": note
          }
          Path("metadata/version.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")

          p = Path("metadata/changelog.json")
          try:
              catalog = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              catalog = {"schemaVersion": 1, "releases": []}
          releases = catalog.setdefault("releases", [])
          releases.append({
              "version": version,
              "versionCode": code,
              "publishedUtc": published,
              "notes": note
          })
          releases[:] = sorted(releases, key=lambda x: int(x.get("versionCode", 0)))[-200:]
          catalog["schemaVersion"] = 1
          p.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/version.json metadata/changelog.json
          git commit -m "Version DeviceDB ${VERSION} [skip ci]" || exit 0
          git push
