name: Install final localization packages
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated localization artifact
        env:
          PACKAGE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-6818-820a-a1e9-a2b40fcd1183/raw?se=2026-08-27T21%3A19%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=ba265c68-6024-59fa-919c-21e0b0b8bf4e&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T06%3A11%3A17Z&ske=2026-08-28T06%3A11%3A17Z&sks=b&skv=2026-02-06&sig=2cg9OFZgh/e6Mp0BGrpjgtPRjm1J%2BtAD9klo6APXEGk%3D"
        run: |
          curl -L --fail --retry 3 "$PACKAGE_URL" -o /tmp/localization.zip
          rm -rf /tmp/localization && mkdir -p /tmp/localization
          unzip -q /tmp/localization.zip -d /tmp/localization
          for lang in en hu de fr ru; do
            test -s "/tmp/localization/$lang.json"
            cp "/tmp/localization/$lang.json" "localization/$lang.json"
          done
      - name: Validate language packs
        shell: python
        run: |
          import json,re,pathlib
          langs=('en','hu','de','fr','ru')
          docs={l:json.loads(pathlib.Path(f'localization/{l}.json').read_text(encoding='utf-8')) for l in langs}
          sets={l:set(d['strings']) for l,d in docs.items()}
          base=sets['en']
          assert len(base)>=500, len(base)
          assert all(v==base for v in sets.values())
          ph=re.compile(r'\{\d+\}')
          for lang,d in docs.items():
            assert d['language']==lang
            assert all(str(v).strip() for v in d['strings'].values())
            for k,v in d['strings'].items():
              expected=ph.findall(docs['en']['strings'][k]) if k.startswith('Update.') else ph.findall(k)
              assert sorted(expected)==sorted(ph.findall(v)), (lang,k,v)
          print('validated keys:',len(base))
      - name: Commit localization packs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add localization/en.json localization/hu.json localization/de.json localization/fr.json localization/ru.json
          git commit -m "Complete app localization for en hu de fr ru"
          git push
