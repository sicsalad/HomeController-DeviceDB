            },
            'fr': {
              'Aktuális állapot':'État actuel','Vezérlés':'Commandes','Nincs visszaadott állapotadat.':'Aucune donnée d’état renvoyée.','Kikapcsolás':'Éteindre','Bekapcsolás':'Allumer','Fényerő: {0}%':'Luminosité : {0}%','Fényerő beállítása':'Régler la luminosité','Érték:':'Valeur :','Hubitat frissítés':'Actualisation Hubitat','Kapcsoló':'Interrupteur','Fényerő':'Luminosité','Hőmérséklet':'Température','Páratartalom':'Humidité','Akkumulátor':'Batterie','Mozgás':'Mouvement','Ajtó/ablak':'Porte/fenêtre','Jelenlét':'Présence','Zár':'Serrure','BE':'ON','KI':'OFF','Nyitás':'Ouvrir','Zárás':'Fermer','Bezárás':'Verrouiller','Feloldás':'Déverrouiller','Eszköz frissítése':'Actualiser l’appareil','Hubitat eszközök':'Appareils Hubitat','Típus szűrő':'Filtre de type','Helyiség':'Pièce','↻ Frissítés':'↻ Actualiser','{0} eszköz · mentett állapot':'{0} appareils · état en cache','Hubitat eszközök lekérése...':'Chargement des appareils Hubitat...','{0} eszköz · frissítve {1}':'{0} appareils · actualisé {1}','Hubitat kommunikációs hiba':'Erreur de communication Hubitat','Összes helyiség':'Toutes les pièces','Nincs ilyen eszköz.':'Aucun appareil correspondant.','{0}: kész':'{0} : terminé','Hubitat parancs':'Commande Hubitat','Nincs helyiség':'Aucune pièce','Egyéb':'Autre','Termosztát':'Thermostat','Lámpa':'Lampe','Hő/Pára':'Temp./Humidité','Hőmérő':'Thermomètre','Páramérő':'Capteur d’humidité','Szenzor':'Capteur','Név, pl. Otthoni Hubitat':'Nom, ex. Hubitat maison','Hub címe, pl. 192.168.100.64':'Adresse du hub, ex. 192.168.100.64','Hubitat hozzáadása':'Ajouter Hubitat','Kapcsolat tesztelése':'Tester la connexion','Hubitat mentése':'Enregistrer Hubitat','Kapcsolódás...':'Connexion...','Kapcsolat rendben. {0} engedélyezett Hubitat eszköz található.':'Connexion OK. {0} appareils Hubitat autorisés trouvés.','Kapcsolati hiba':'Erreur de connexion','Hiányos beállítás.':'Configuration incomplète.','Mentve. {0} eszköz érhető el.':'Enregistré. {0} appareils disponibles.'
            },
            'ru': {
              'Aktuális állapot':'Текущее состояние','Vezérlés':'Управление','Nincs visszaadott állapotadat.':'Данные состояния не получены.','Kikapcsolás':'Выключить','Bekapcsolás':'Включить','Fényerő: {0}%':'Яркость: {0}%','Fényerő beállítása':'Установить яркость','Érték:':'Значение:','Hubitat frissítés':'Обновление Hubitat','Kapcsoló':'Переключатель','Fényerő':'Яркость','Hőmérséklet':'Температура','Páratartalom':'Влажность','Akkumulátor':'Батарея','Mozgás':'Движение','Ajtó/ablak':'Дверь/окно','Jelenlét':'Присутствие','Zár':'Замок','BE':'ВКЛ','KI':'ВЫКЛ','Nyitás':'Открыть','Zárás':'Закрыть','Bezárás':'Заблокировать','Feloldás':'Разблокировать','Eszköz frissítése':'Обновить устройство','Hubitat eszközök':'Устройства Hubitat','Típus szűrő':'Фильтр типа','Helyiség':'Комната','↻ Frissítés':'↻ Обновить','{0} eszköz · mentett állapot':'{0} устройств · сохранённое состояние','Hubitat eszközök lekérése...':'Загрузка устройств Hubitat...','{0} eszköz · frissítve {1}':'{0} устройств · обновлено {1}','Hubitat kommunikációs hiba':'Ошибка связи с Hubitat','Összes helyiség':'Все комнаты','Nincs ilyen eszköz.':'Нет подходящих устройств.','{0}: kész':'{0}: готово','Hubitat parancs':'Команда Hubitat','Nincs helyiség':'Без комнаты','Egyéb':'Другое','Termosztát':'Термостат','Lámpa':'Лампа','Hő/Pára':'Темп./влажность','Hőmérő':'Термометр','Páramérő':'Датчик влажности','Szenzor':'Датчик','Név, pl. Otthoni Hubitat':'Имя, напр. Домашний Hubitat','Hub címe, pl. 192.168.100.64':'Адрес хаба, напр. 192.168.100.64','Hubitat hozzáadása':'Добавить Hubitat','Kapcsolat tesztelése':'Проверить соединение','Hubitat mentése':'Сохранить Hubitat','Kapcsolódás...':'Подключение...','Kapcsolat rendben. {0} engedélyezett Hubitat eszköz található.':'Соединение установлено. Найдено устройств Hubitat: {0}.','Kapcsolati hiba':'Ошибка соединения','Hiányos beállítás.':'Настройка не завершена.','Mentve. {0} eszköz érhető el.':'Сохранено. Доступно устройств: {0}.'
            }
          }
          for code, vals in translations.items():
              p=Path(f'localization/{code}.json')
              data=json.loads(p.read_text(encoding='utf-8'))
              strings=data.setdefault('strings',{})
              if code=='hu':
                  for key in translations['en']:
                      strings[key]=key
              else:
                  strings.update(vals)
              data['strings']=dict(sorted(strings.items(), key=lambda kv: kv[0].casefold()))
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-hubitat-localization.yml
          git add localization/*.json
          git commit -m "Complete Hubitat localization vocabulary"
          git pull --rebase origin main
          git push origin HEAD:main
