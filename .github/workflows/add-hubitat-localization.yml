name: Add Hubitat localization vocabulary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-hubitat-localization.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Hubitat translations
        shell: python
        run: |
          import json
          from pathlib import Path
          translations = {
            'en': {
              'Aktuális állapot':'Current state','Vezérlés':'Controls','Nincs visszaadott állapotadat.':'No state data returned.','Kikapcsolás':'Turn off','Bekapcsolás':'Turn on','Fényerő: {0}%':'Brightness: {0}%','Fényerő beállítása':'Set brightness','Érték:':'Value:','Hubitat frissítés':'Hubitat refresh','Kapcsoló':'Switch','Fényerő':'Brightness','Hőmérséklet':'Temperature','Páratartalom':'Humidity','Akkumulátor':'Battery','Mozgás':'Motion','Ajtó/ablak':'Door/window','Jelenlét':'Presence','Zár':'Lock','BE':'ON','KI':'OFF','Nyitás':'Open','Zárás':'Close','Bezárás':'Lock','Feloldás':'Unlock','Eszköz frissítése':'Refresh device','Hubitat eszközök':'Hubitat devices','Típus szűrő':'Type filter','Helyiség':'Room','↻ Frissítés':'↻ Refresh','{0} eszköz · mentett állapot':'{0} devices · cached state','Hubitat eszközök lekérése...':'Loading Hubitat devices...','{0} eszköz · frissítve {1}':'{0} devices · refreshed {1}','Hubitat kommunikációs hiba':'Hubitat communication error','Összes helyiség':'All rooms','Nincs ilyen eszköz.':'No matching device.','{0}: kész':'{0}: done','Hubitat parancs':'Hubitat command','Nincs helyiség':'No room','Egyéb':'Other','Termosztát':'Thermostat','Lámpa':'Light','Hő/Pára':'Temp/Humidity','Hőmérő':'Thermometer','Páramérő':'Humidity sensor','Szenzor':'Sensor','Név, pl. Otthoni Hubitat':'Name, e.g. Home Hubitat','Hub címe, pl. 192.168.100.64':'Hub address, e.g. 192.168.100.64','Hubitat hozzáadása':'Add Hubitat','Kapcsolat tesztelése':'Test connection','Hubitat mentése':'Save Hubitat','Kapcsolódás...':'Connecting...','Kapcsolat rendben. {0} engedélyezett Hubitat eszköz található.':'Connection OK. {0} authorized Hubitat devices found.','Kapcsolati hiba':'Connection error','Hiányos beállítás.':'Incomplete setup.','Mentve. {0} eszköz érhető el.':'Saved. {0} devices available.'
